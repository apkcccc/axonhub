        value: 8090
      - key: AXONHUB_DB_DIALECT
        value: postgres
      - key: AXONHUB_DB_DSN
        value: postgresql://postgres:dubo104396104396@db.bqmlfsmzbtdcgybnkrls.supabase.co:5432/postgres
      - key: AXONHUB_LOG_LEVEL
        value: info
      - key: AXONHUB_CACHE_MODE
        value: redis
      - key: AXONHUB_CACHE_REDIS_URL
